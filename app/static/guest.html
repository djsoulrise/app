<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zahtev za pesmu</title>
    <style>
        body {
            margin: 0;
            background: #0f1115;
            color: #eceff4;
            font: 18px/1.4 system-ui, sans-serif
        }

        .w {
            max-width: 560px;
            margin: auto;
            padding: 16px
        }

        h1 {
            color: #ff9f1c;
            margin: 8px 0
        }

        h3 {
            color: #ff9f1c
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            background: #12151b;
            color: #fff;
            border: 1px solid #333a48;
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            margin: 6px 0
        }

        button {
            background: #ff9f1c;
            color: #000;
            border: 0;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            margin: 6px 0
        }

        button.s {
            background: #232732;
            color: #fff;
            width: auto;
            padding: 6px 12px;
            font-size: 15px
        }

        .it {
            background: #1a1d24;
            border-radius: 10px;
            padding: 10px 12px;
            margin: 6px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .it.sel {
            outline: 2px solid #ff9f1c
        }

        .mut {
            color: #9aa3b2;
            font-size: 15px
        }

        img {
            max-width: 100%;
            border-radius: 10px;
            margin: 8px 0
        }

        .msg {
            background: #1f3a2c;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0
        }

        .err {
            background: #4a1f21
        }
    </style>
</head>

<body>
    <div class="w">
        <h1 id="ev">Zahtev za pesmu</h1>
        <div id="closed" class="msg err" style="display:none">Zahtevi trenutno nisu otvoreni.</div>
        <div id="form">
            <input id="q" placeholder="Trazi pesmu ili izvodjaca..." autocomplete="off">
            <div id="res"></div>
            <div id="chosen" class="mut"></div>
            <input id="free" placeholder="Nema je na listi? Upisi izvodjaca i naslov">
            <input id="name" placeholder="Tvoje ime (nije obavezno)" maxlength="40">
            <textarea id="msg" placeholder="Poruka (npr. za mladence)" maxlength="200" rows="2"></textarea>
            <button id="send">Posalji zahtev</button>
            <div id="out"></div>
        </div>
        <div id="tip" style="display:none">
            <h3>Hvala!</h3>
            <div id="tiptext"></div><img id="tipqr" style="display:none;background:#fff;padding:8px"><img id="tipimg"
                style="display:none">
        </div>
        <h3>Zahtevi i glasovi</h3>
        <div id="list"></div>
    </div>
    <script>
        const $ = s => document.querySelector(s);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        let chosen = null, info = null, tm;
        async function j(u, b) { const r = await fetch(u, b ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) } : {}); let d = null; try { d = await r.json() } catch { } if (!r.ok) throw new Error(d && d.detail || 'Greska'); return d }
        async function init() {
            info = await j('/api/guest/info'); $('#ev').textContent = info.event || 'Zahtev za pesmu';
            if (!info.open) { $('#closed').style.display = 'block'; $('#form').style.display = 'none' } load()
        }
        async function load() { try { const l = await j('/api/guest/list'); $('#list').innerHTML = l.map(x => `<div class="it"><span>${esc(x.song)}</span><button class="s" data-v="${x.id}">+1 (${x.votes})</button></div>`).join('') || '<div class="mut">Jos nema zahteva.</div>' } catch { } }
        $('#list').addEventListener('click', async e => { const b = e.target.closest('[data-v]'); if (!b) return; try { await j('/api/guest/vote/' + b.dataset.v, {}); load() } catch (x) { } });
        $('#q').addEventListener('input', e => {
            clearTimeout(tm); tm = setTimeout(async () => {
                const q = e.target.value.trim(); if (q.length < 2) { $('#res').innerHTML = ''; return }
                const r = await j('/api/guest/search?q=' + encodeURIComponent(q)); $('#res').innerHTML = r.map(t => `<div class="it" data-id="${t.id}" data-n="${esc(t.artist + ' - ' + t.title)}"><span>${esc(t.artist)} - ${esc(t.title)}</span></div>`).join('')
            }, 250)
        });
        $('#res').addEventListener('click', e => { const d = e.target.closest('[data-id]'); if (!d) return; chosen = +d.dataset.id; $('#chosen').textContent = 'Izabrano: ' + d.dataset.n; $('#res').innerHTML = ''; $('#q').value = '' });
        $('#send').addEventListener('click', async () => {
            $('#out').innerHTML = '';
            try {
                const r = await j('/api/guest/request', { track_id: chosen, free_text: $('#free').value, name: $('#name').value, message: $('#msg').value });
                $('#out').innerHTML = `<div class="msg">${esc(r.msg)}</div>`; chosen = null; $('#chosen').textContent = ''; $('#free').value = ''; $('#msg').value = ''; load(); showTip()
            }
            catch (e) { $('#out').innerHTML = `<div class="msg err">${esc(e.message)}</div>` }
        });
        function showTip() {
            if (!info.tip_text && !info.tip_qr && !info.tip_image) return; $('#tip').style.display = 'block'; $('#tiptext').textContent = info.tip_text || 'Ako zelis da pocastis DJ-a:';
            if (info.tip_qr) { $('#tipqr').src = '/api/guest/tip-qr.png'; $('#tipqr').style.display = 'block' }
            if (info.tip_image) { $('#tipimg').src = info.tip_image; $('#tipimg').style.display = 'block' }
        }
        init(); setInterval(load, 10000);
    </script>
</body>

</html>
