<!DOCTYPE html>
<html lang="sr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DJ Miljan Assistant Lite</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <div class="brand"><span class="brand-mark">DJ</span><span>MILJAN ASSISTANT<small>LITE CONSOLE</small></span></div>
        <nav id="nav"></nav>
        <div id="statusbar"></div>
        <button id="homebtn" data-act="go" data-p="sada">Sada</button>
        <button id="settingsbtn" data-act="navmenu" aria-label="Opcije i podesavanja" aria-controls="nav" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" aria-hidden="true"><path d="m10 2-.6 3-2 .9-2.7-1.1-2 3.4L5 10v2l-2.3 1.8 2 3.4 2.7-1.1 2 .9.6 3h4l.6-3 2-.9 2.7 1.1 2-3.4L19 12v-2l2.3-1.8-2-3.4-2.7 1.1-2-.9-.6-3Z"/><circle cx="12" cy="11" r="3"/></svg>Opcije</button>
        <span id="fsbtns"><button class="sm" data-act="fs" data-d="-2">A-</button><button class="sm" data-act="fs"
                data-d="2">A+</button></span>
        <button id="minibtn" data-act="mini" class="sm">Mini</button>
    </header>
    <main id="main"></main>
    <div id="modal" class="hidden">
        <div class="box" id="modalbox"></div>
    </div>
    <div id="toast"></div>
    <script src="/static/app.js?v=lite1"></script>
</body>

</html>
