name: Windows Lite standalone EXE
on:
  push:
    branches: [lite]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt pytest pywebview pyinstaller
      - name: Test original recommendations, keyboard, history and exports
        run: python -m pytest tests/test_core.py tests/test_lite.py tests/test_event_exports.py tests/test_history_context.py tests/test_learning_import.py tests/test_broadcast.py tests/test_native_files.py tests/test_shortcuts.py -q
      - name: Test compact Lite UI
        run: |
          npm install --no-save playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/ui-smoke.cjs
      - name: Test real Windows window restore
        run: python -m app.restore_smoke restore-source.json
      - name: Package single Lite executable
        run: python -m PyInstaller --noconfirm --clean "DJ asistent.spec"
      - name: Verify frozen Lite and real window restore
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile
          exe=pathlib.Path('dist/DJ Miljan Assistant Lite.exe').resolve()
          with tempfile.TemporaryDirectory() as folder:
              env=dict(os.environ,DJ_DATA_DIR=str(pathlib.Path(folder)/'data'))
              for command,name in [('--build-self-test','lite.json'),('--window-restore-self-test','restore.json')]:
                  report=pathlib.Path(folder)/name
                  result=subprocess.run([str(exe),command,str(report)],env=env,timeout=140)
                  assert result.returncode==0,report.read_text() if report.exists() else result
                  data=json.loads(report.read_text())
                  assert data['ok'],data
                  if name=='lite.json':assert data['frozen'] and not data['heavy_modules_loaded']
                  else:assert data['painted'] and data['state_preserved'] and data['cycles']==3
              print('EXE bytes:',exe.stat().st_size)
      - uses: actions/upload-artifact@v4
        with:
          name: DJ-Miljan-Assistant-Lite
          path: dist/DJ Miljan Assistant Lite.exe
          if-no-files-found: error
          retention-days: 30
      - name: Save UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lite-layout-previews
          path: ui-console-*.png
          if-no-files-found: warn
