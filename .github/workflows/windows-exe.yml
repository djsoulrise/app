name: Windows standalone EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  ORT_DISABLE_TELEMETRY: '1'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pywebview pyinstaller
      - name: Install CPU-only model export tools
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install onnx==1.23.2
      - name: Export and verify the pinned pretrained model
        run: python build_tools/export_vinet.py
      - name: Test audio analysis and persistent cache
        run: |
          python -m unittest discover -s tests -p "test_audio*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_native_files.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_shortcuts.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_chorus.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_auto_chorus.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_learned_audio.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_phrase_match.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_sample_match.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_event_exports.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_history_context.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_loop_audio.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_learning_import.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_fast_median.py" -v
      - name: Test live UI and Start Stop controls
        run: |
          npm install --no-save playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/ui-smoke.cjs
      - name: Test actual WebView restore and painted content
        run: python -m app.restore_smoke restore-source.json
      - name: Package one executable including FFmpeg
        run: python -m PyInstaller --noconfirm --clean "DJ asistent.spec"
      - name: Check packaged EXE without opening a window
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory() as folder:
              report = pathlib.Path(folder) / 'report.json'
              env = dict(os.environ, DJ_DATA_DIR=str(pathlib.Path(folder) / 'data'))
              completed = subprocess.run([str(pathlib.Path('dist/DJ Miljan Assistant.exe').resolve()), '--build-self-test', str(report)], env=env, check=False, timeout=180)
              if completed.returncode: raise RuntimeError(report.read_text(encoding='utf-8') if report.exists() else 'Packaged self-test failed before writing report')
              result = json.loads(report.read_text(encoding='utf-8'))
              assert result['ok'] and result['parallel_audio'] and result['native_file_drop'] and result['shortcuts_backend'] and result['phrase_features'] and result['periodic_features'] and result['learned_model'] and result['frozen'] and result['decoder_in_bundle'], result
      - name: Check packaged WebView restore
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile
          with tempfile.TemporaryDirectory() as folder:
              report = pathlib.Path(folder) / 'restore.json'
              env = dict(os.environ, DJ_DATA_DIR=str(pathlib.Path(folder) / 'data'))
              subprocess.run([str(pathlib.Path('dist/DJ Miljan Assistant.exe').resolve()), '--window-restore-self-test', str(report)], env=env, check=True, timeout=140)
              result = json.loads(report.read_text(encoding='utf-8'))
              assert result['ok'] and result['painted'] and result['state_preserved'] and result['cycles']==3, result
      - uses: actions/upload-artifact@v4
        with:
          name: DJ-Assistant-Windows-Standalone
          path: dist/DJ Miljan Assistant.exe
          if-no-files-found: error
          retention-days: 14

      - name: Save console layout previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Console-layout-previews
          path: ui-console-*.png
          if-no-files-found: warn
          retention-days: 7

